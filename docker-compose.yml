services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: copyflow
      POSTGRES_USER: copyflow
      POSTGRES_PASSWORD: copyflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copyflow"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://copyflow:copyflow@postgres:5432/copyflow
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./app:/srv/app

volumes:
  pgdata:
